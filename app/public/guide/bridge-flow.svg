<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 540" width="360" height="540" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <rect width="360" height="540" rx="16" fill="#0B0B10"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9797A6"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B8FF3C"/></marker>
  </defs>
  <text x="20" y="34" fill="#9797A6" font-size="12" font-weight="700" letter-spacing="0.6">ON ETHEREUM</text>
  <rect x="20" y="44" width="320" height="58" rx="12" fill="#15151C" stroke="#262631"/>
  <text x="36" y="69" fill="#F4F4F6" font-size="16" font-weight="600">Your wallet</text>
  <text x="36" y="90" fill="#9797A6" font-size="13">0.0418 ETH</text>
  <line x1="60" y1="104" x2="60" y2="146" stroke="#9797A6" stroke-width="2" marker-end="url(#a)"/>
  <text x="78" y="122" fill="#F4F4F6" font-size="14" font-weight="600">1 · You sign one deposit</text>
  <text x="78" y="140" fill="#9797A6" font-size="13">0.018828 ETH, checked first by FloorFeed</text>
  <rect x="20" y="150" width="320" height="58" rx="12" fill="#15151C" stroke="#262631"/>
  <text x="36" y="175" fill="#F4F4F6" font-size="16" font-weight="600">Relay deposit</text>
  <text x="36" y="196" fill="#9797A6" font-size="13">confirms on Ethereum (~1–3 min)</text>
  <line x1="60" y1="210" x2="60" y2="252" stroke="#9797A6" stroke-width="2" marker-end="url(#a)"/>
  <text x="78" y="228" fill="#F4F4F6" font-size="14" font-weight="600">2 · Relay sees it land</text>
  <text x="78" y="246" fill="#9797A6" font-size="13">bridge fee about $0.04</text>
  <rect x="20" y="256" width="320" height="58" rx="12" fill="#15151C" stroke="#A78BFA"/>
  <text x="36" y="281" fill="#A78BFA" font-size="16" font-weight="700">Relay solver</text>
  <text x="36" y="302" fill="#9797A6" font-size="13">already holds ETH on the other side</text>
  <line x1="60" y1="316" x2="60" y2="380" stroke="#B8FF3C" stroke-width="2" marker-end="url(#g)"/>
  <text x="78" y="334" fill="#F4F4F6" font-size="14" font-weight="600">3 · Pays you out from its own funds</text>
  <text x="78" y="352" fill="#9797A6" font-size="13">seconds after step 2; refunds you</text>
  <text x="78" y="368" fill="#9797A6" font-size="13">on Ethereum if it can't deliver</text>
  <text x="20" y="400" fill="#9797A6" font-size="12" font-weight="700" letter-spacing="0.6">ON ROBINHOOD CHAIN</text>
  <rect x="20" y="410" width="320" height="58" rx="12" fill="#15151C" stroke="#B8FF3C"/>
  <text x="36" y="435" fill="#F4F4F6" font-size="16" font-weight="600">Your wallet (same address)</text>
  <text x="36" y="456" fill="#B8FF3C" font-size="13" font-weight="600">+0.0188 ETH, exactly what you asked for</text>
  <text x="20" y="500" fill="#9797A6" font-size="13">FloorFeed gets the quote, checks the deposit</text>
  <text x="20" y="519" fill="#9797A6" font-size="13">and follows it. It never holds the money.</text>
</svg>
